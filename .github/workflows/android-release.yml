name: Android Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    name: Build Signed Release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" || { echo "ERROR: sdkmanager not found"; exit 1; }
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.XELVRA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ERROR: Missing keystore secret"; exit 1; }
          echo "::add-mask::$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xelvra-release.jks"
          chmod 600 "$RUNNER_TEMP/xelvra-release.jks"
          echo "XELVRA_KEYSTORE_PATH=$RUNNER_TEMP/xelvra-release.jks" >> "$GITHUB_ENV"

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME" || { echo "ERROR: versionName not found"; exit 1; }

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "ERROR: Invalid release tag format: $GITHUB_REF_NAME"
              exit 1
            fi

            EXPECTED_TAG="v${VERSION_NAME}"
            test "$GITHUB_REF_NAME" = "$EXPECTED_TAG" || {
              echo "ERROR: Tag $GITHUB_REF_NAME does not match $EXPECTED_TAG"
              exit 1
            }
          fi

          echo "RELEASE_VERSION=v${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "PASS: Android version $VERSION_NAME"

      - name: Build signed Release APKs
        env:
          XELVRA_STORE_PASSWORD: ${{ secrets.XELVRA_STORE_PASSWORD }}
          XELVRA_KEY_PASSWORD: ${{ secrets.XELVRA_KEY_PASSWORD }}
        run: |
          bash ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Verify and prepare APKs
        run: |
          set -euo pipefail
          mkdir -p release-apks

          VERSION="$RELEASE_VERSION"
          for ABI in arm64-v8a armeabi-v7a universal; do
            SRC="app/build/outputs/apk/release/app-${ABI}-release.apk"
            DST="release-apks/Xelvra-${VERSION}-${ABI}.apk"
            test -f "$SRC"
            cp "$SRC" "$DST"
            SIGNING_INFO="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$DST")"
            printf '%s\n' "$SIGNING_INFO" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true'
            printf '%s\n' "$SIGNING_INFO" | grep -qi 'certificate SHA-256 digest: 5d637df5e23410adc66a31ddd02de9e2da9f90a30ac248011248350d20d7865c'
            echo "PASS: $DST signed with Xelvra release certificate"
          done

          (cd release-apks && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh release-apks/

      - name: Publish normal GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          HTTP_STATUS="$(curl --silent --show-error --location \
            --output /dev/null \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")"

          case "$HTTP_STATUS" in
            200) echo "INFO: Release already exists" ;;
            404) echo "INFO: Release does not exist yet" ;;
            *) echo "ERROR: GitHub API returned HTTP $HTTP_STATUS"; exit 1 ;;
          esac

          if [[ "$HTTP_STATUS" == "200" ]]; then
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease=false \
              --latest
            echo "PASS: Existing release $GITHUB_REF_NAME is normal; skipping duplicate publication"
            exit 0
          fi

          gh release create "$GITHUB_REF_NAME" release-apks/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Xelvra $GITHUB_REF_NAME" \
            --notes "Xelvra Android $GITHUB_REF_NAME.

          Downloads:
          - arm64-v8a: Modern ARM Android devices.
          - armeabi-v7a: Supported 32-bit ARM Android devices.
          - universal: Both supported ARM architectures.

          SHA-256 checksums are included in SHA256SUMS.txt." \
            --latest

      - name: Upload signed Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: xelvra-signed-release-apks
          path: release-apks/
          if-no-files-found: error
          retention-days: 30
