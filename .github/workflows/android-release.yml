name: Android Release APK

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Android CI
    types:
      - completed
    branches:
      - main
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '!v*-build.*'

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    name: Build Signed Release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Prepare automatic release version
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          CI_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          [[ "$CI_RUN_NUMBER" =~ ^[0-9]+$ ]] || {
            echo "ERROR: Invalid CI run number"
            exit 1
          }
          (( CI_RUN_NUMBER >= 1 && CI_RUN_NUMBER <= 2099999998 )) || {
            echo "ERROR: CI run number out of range"
            exit 1
          }
          echo "CI_RUN_NUMBER=$CI_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "AUTO_RELEASE_TAG=v0.1.0-build.$CI_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" || { echo "ERROR: sdkmanager not found"; exit 1; }
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.XELVRA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ERROR: Missing keystore secret"; exit 1; }
          echo "::add-mask::$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xelvra-release.jks"
          chmod 600 "$RUNNER_TEMP/xelvra-release.jks"
          echo "XELVRA_KEYSTORE_PATH=$RUNNER_TEMP/xelvra-release.jks" >> "$GITHUB_ENV"

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(grep -oE '"0\.[0-9]+\.[0-9]+"' app/build.gradle.kts | head -n 1 | tr -d '"')"
          test -n "$BASE_VERSION" || {
            echo "ERROR: Base version not found"
            exit 1
          }

          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            test -n "${CI_RUN_NUMBER:-}" || exit 1
            VERSION_NAME="${BASE_VERSION}+build.${CI_RUN_NUMBER}"
            RELEASE_TAG="v${BASE_VERSION}-build.${CI_RUN_NUMBER}"
          else
            VERSION_NAME="$BASE_VERSION"
            RELEASE_TAG="v${BASE_VERSION}"

            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              test "$GITHUB_REF_NAME" = "$RELEASE_TAG" || {
                echo "ERROR: Tag does not match app version"
                exit 1
              }
            fi
          fi

          echo "RELEASE_VERSION=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "PASS: Android version $VERSION_NAME"
          echo "PASS: Release tag $RELEASE_TAG"
      - name: Build signed Release APKs
        env:
          XELVRA_STORE_PASSWORD: ${{ secrets.XELVRA_STORE_PASSWORD }}
          XELVRA_KEY_PASSWORD: ${{ secrets.XELVRA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            bash ./gradlew :app:assembleRelease "-PciRunNumber=$CI_RUN_NUMBER" --no-daemon --console=plain
          else
            bash ./gradlew :app:assembleRelease --no-daemon --console=plain
          fi
      - name: Verify and prepare APKs
        run: |
          set -euo pipefail
          mkdir -p release-apks

          VERSION="$RELEASE_VERSION"
          for ABI in arm64-v8a armeabi-v7a universal; do
            SRC="app/build/outputs/apk/release/app-${ABI}-release.apk"
            DST="release-apks/Xelvra-${VERSION}-${ABI}.apk"
            test -f "$SRC"
            cp "$SRC" "$DST"
            SIGNING_INFO="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$DST")"
            printf '%s\n' "$SIGNING_INFO" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true'
            printf '%s\n' "$SIGNING_INFO" | grep -qi 'certificate SHA-256 digest: 5d637df5e23410adc66a31ddd02de9e2da9f90a30ac248011248350d20d7865c'
            echo "PASS: $DST signed with Xelvra release certificate"
          done

          (cd release-apks && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh release-apks/

      - name: Publish normal GitHub Release
        if: >-
          github.event_name == 'workflow_run' ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="$RELEASE_TAG"
          TARGET_SHA="$GITHUB_SHA"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            TARGET_SHA="$SOURCE_SHA"

            [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "ERROR: Invalid source commit"
              exit 1
            }

            CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            test "$CURRENT_MAIN" = "$TARGET_SHA" || {
              echo "ERROR: main has moved since CI; skipping stale release"
              exit 1
            }

            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              EXISTING_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
              test "$EXISTING_SHA" = "$TARGET_SHA" || {
                echo "ERROR: Tag exists at a different commit"
                exit 1
              }
            else
              gh api "repos/$GITHUB_REPOSITORY/git/refs"        -f ref="refs/tags/$TAG"        -f sha="$TARGET_SHA" >/dev/null
            fi
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "INFO: Release already exists; checking assets"

            EXISTING_ASSETS="$(gh release view "$TAG"               --repo "$GITHUB_REPOSITORY"               --json assets               --jq '.assets[].name')"

            for FILE in release-apks/*; do
              NAME="${FILE##*/}"
              if ! grep -Fxq "$NAME" <<< "$EXISTING_ASSETS"; then
                echo "ERROR: Existing release missing asset $NAME"
                exit 1
              fi
            done

            gh release edit "$TAG"               --repo "$GITHUB_REPOSITORY"               --prerelease=false               --latest

            echo "PASS: Existing release assets verified"
            exit 0
          fi

          gh release create "$TAG" release-apks/*    --repo "$GITHUB_REPOSITORY"    --target "$TARGET_SHA"    --title "Xelvra $TAG"    --notes "Signed Xelvra Android APKs for arm64-v8a, armeabi-v7a and universal. SHA-256 checksums are included."    --latest

          echo "PASS: Published normal Latest release $TAG"
      - name: Upload signed Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: xelvra-signed-release-apks
          path: release-apks/
          if-no-files-found: error
          retention-days: 30
